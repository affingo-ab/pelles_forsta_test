<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Hantera Dataset - Pelles Första Test</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 2rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background-color: #f1f3f5; }
        input[type="text"], input[type="number"] { padding: 6px; width: 150px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 6px 12px; text-decoration: none; border-radius: 4px; color: white; cursor: pointer; border: none; font-size: 0.9rem; }
        .back-btn { background: #6c757d; }
        .back-btn:hover { background: #5a6268; }
        .add-btn { background: #28a745; }
        .add-btn:hover { background: #218838; }
        .update-btn { background: #007bff; }
        .update-btn:hover { background: #0056b3; }
        .delete-btn { background: #dc3545; }
        .delete-btn:hover { background: #c82333; }
        .form-inline { display: flex; gap: 10px; align-items: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Hantera Dataset</h1>
        <a href="/dashboard" class="btn back-btn">Tillbaka till Dashboard</a>
    </div>

    <!-- Lägg till ny rad -->
    <div class="card">
        <h3>Lägg till ny post</h3>
        <form method="POST" class="form-inline">
            <input type="hidden" name="action" value="add">
            <input type="text" name="name" placeholder="Namn" required>
            <input type="number" step="any" name="value" placeholder="Värde" required>
            <button type="submit" class="btn add-btn">Lägg till</button>
        </form>
    </div>

    <!-- Befintliga rader (Redigera / Ta bort) -->
    <div class="card">
        <h3>Befintliga poster</h3>
        <table>
            <thead>
                <tr>
                    <th>Namn</th>
                    <th>Värde</th>
                    <th>Åtgärd</th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <form method="POST">
                        <input type="hidden" name="index" value="{{ loop.index0 }}">
                        <td>
                            <input type="text" name="name" value="{{ row.name }}" required>
                        </td>
                        <td>
                            <input type="number" step="any" name="value" value="{{ row.value }}" required>
                        </td>
                        <td>
                            <button type="submit" name="action" value="update" class="btn update-btn">Spara</button>
                            <button type="submit" name="action" value="delete" class="btn delete-btn" onclick="return confirm('Är du säker på att du vill ta bort denna rad?');">Ta bort</button>
                        </td>
                    </form>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
